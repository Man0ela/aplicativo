<head>

   crossorigin="anonymous">
  <link href="style1.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"/>
</head>

<body>
  <header class="d-flex flex-wrap justify-content-between align-items-center py-3 mb-4 border-bottom px-4">
    <!-- Logo / Nome do site -->
    <a href="/" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto link-body-emphasis text-decoration-none">
      <svg class="bi me-2" width="40" height="32" aria-hidden="true"><use xlink:href="#bootstrap"/></svg>
      <span class="fs-4">Getservices</span>
    </a>
  
    <!-- Menu de navegação -->
    <ul class="nav nav-pills me-3">
      <li class="nav-item"><a href="#" class="nav-link active" aria-current="page">Login</a></li>
      <li class="nav-item"><a href="#" class="nav-link">Segurança</a></li>
      <li class="nav-item"><a href="#" class="nav-link">Entre como profissional</a></li>
    </ul>
  
    <!-- Ícone de perfil com redirecionamento -->
    <a href="servicos-contratados.html" class="text-decoration-none">
      <i class="bi bi-person-circle fs-3"></i>
    </a>
  </header>
    <div class="container2">
      <h1>Buscar Profissionais Terceirizados</h1>
      <label for="barra-pesquisa">Digite o tipo de serviço:</label><br>
      <div class="input-group mb-3" style="max-width: 500px; align-items: stretch;">
        <button 
          class="btn btn-primary d-flex align-items-center justify-content-center" 
          type="button" 
          onclick="buscarProfissionais()" 
          style="border-top-right-radius: 0; border-bottom-right-radius: 0;"
        >
          <i class="bi bi-search"></i>
        </button>
        <input 
          type="text" 
          id="barra-pesquisa" 
          class="form-control" 
          list="sugestoes-servico" 
          placeholder="Ex: Piscineiro, Faxineira, Jardineiro"
          style="border-top-left-radius: 0; border-bottom-left-radius: 0;"
        >
      </div>
      <datalist id="sugestoes-servico">
        <option value="Piscineiro">
        <option value="Faxineira">
        <option value="Jardineiro">
      </datalist>
    </div>
    
  <datalist id="sugestoes-servico">
    <option value="Piscineiro">
    <option value="Faxineira">
    <option value="Jardineiro">
  </datalist> 
   <script src="script_tela_busca.js"></script>
   <script 
   src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
