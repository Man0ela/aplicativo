<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <link rel="shortcut icon" href="images/favicon.ico">
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-…"
    crossorigin="anonymous"
  >
  <link href="login.css" rel="stylesheet">
</head>
<body class="bg-light">

    <header class="d-flex flex-wrap justify-content-between py-3 mb-4 border-bottom">
      <a href="/" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto link-body-emphasis text-decoration-none">
        <svg class="bi me-2" width="40" height="32" aria-hidden="true"><use xlink:href="#bootstrap"/></svg>
        <span class="fs-4">Getservices</span>
      </a>
      <ul class="nav nav-pills">
        <li class="nav-item"><a href="#" class="nav-link active" aria-current="page">Login</a></li>
        <li class="nav-item"><a href="#" class="nav-link">Segurança</a></li>
        <li class="nav-item"><a href="#" class="nav-link">Entrar como profissional</a></li>
      </ul>
    </header>
  <div class="d-flex justify-content-center align-items-center py-5 px-3" style="min-height: calc(100vh - 80px);">
    <main class="form-signin mx-auto bg-white p-4 rounded shadow" style="max-width: 360px;">
      <form>
        <h1 class="h3 mb-3 fw-normal text-center">Login</h1>

        <div class="form-floating mb-3">
          <input type="email" class="form-control" id="floatingInput" placeholder="name@example.com">
          <label for="floatingInput">Email</label>
        </div>
        <div class="form-floating mb-3">
          <input type="password" class="form-control" id="floatingPassword" placeholder="Password">
          <label for="floatingPassword">Senha</label>
        </div>

        <div class="form-check text-start mb-3">
          <input class="form-check-input" type="checkbox" id="checkDefault">
          <label class="form-check-label" for="checkDefault">Não perguntar mais</label>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 mb-2">Login</button>
        <button type="button" class="btn btn-secondary w-100 py-2">Não se cadastrou?</button>

        <p class="mt-4 mb-0 text-body-secondary text-center">&copy; 2017–2025</p>
      </form>
    </main>
    </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
